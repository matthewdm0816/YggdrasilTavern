[project]
name = "lightnovel-harness"
version = "0.1.0"
description = "Outline-first Japanese light novel writing harness with an isolated prose-writing context."
requires-python = ">=3.12"
dependencies = [
  "openai>=1.50",
  "google-genai>=1.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.scripts]
lnh = "lnharness.cli:main"

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lnharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
